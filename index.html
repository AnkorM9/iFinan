<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F0F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13111B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mis Finanzas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Mis Finanzas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap">
<style>
html{color-scheme:light;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
:root{
  --bg:#F2F0F8; --bg-2:#E9E5F4; --surface:#FFFFFF; --surface-2:#F5F3FA; --line:#E6E2F0;
  --ink:#1D1929; --muted:#6E6883; --faint:#A39DB6;
  --primary:#4A3B78; --primary-2:#5F4D93; --primary-ink:#FFFFFF; --primary-soft:#E8E3F6;
  --hero-a:#3E3167; --hero-b:#5E4C92;
  --in:#2E8B62; --in-soft:#E0F2E9; --out:#C8485E; --out-soft:#FBE6EA;
  --warn:#C27A1E; --warn-soft:#FBEFD9;
  --c1:#6C5DD3; --c2:#D9728A; --c3:#E9A15B; --c4:#5B8DEF; --c5:#4BB3A0; --c6:#A36CC9; --c7:#9A95AB; --c8:#E07A5F;
  --shadow:0 1px 2px rgba(40,30,80,.05),0 8px 24px rgba(40,30,80,.06);
  --display:"DM Serif Display",Georgia,"Times New Roman",serif;
  --body:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#13111B; --bg-2:#1B1826; --surface:#1D1A28; --surface-2:#252133; --line:#2E2A3E;
    --ink:#EEEBF6; --muted:#A49EB8; --faint:#6F6985;
    --primary:#B7A6F2; --primary-2:#9C89E6; --primary-ink:#1B1530; --primary-soft:#2C2645;
    --hero-a:#3A2D66; --hero-b:#5A4696;
    --in:#62D09B; --in-soft:#173026; --out:#F08397; --out-soft:#3A1C24;
    --warn:#EDB05E; --warn-soft:#3A2C16;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#13111B; --bg-2:#1B1826; --surface:#1D1A28; --surface-2:#252133; --line:#2E2A3E;
  --ink:#EEEBF6; --muted:#A49EB8; --faint:#6F6985;
  --primary:#B7A6F2; --primary-2:#9C89E6; --primary-ink:#1B1530; --primary-soft:#2C2645;
  --hero-a:#3A2D66; --hero-b:#5A4696;
  --in:#62D09B; --in-soft:#173026; --out:#F08397; --out-soft:#3A1C24;
  --warn:#EDB05E; --warn-soft:#3A2C16;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
:root{--safe-b:max(env(safe-area-inset-bottom,0px),8px);--tab-h:60px}
@media (display-mode: standalone){:root{--safe-b:max(env(safe-area-inset-bottom,0px),26px)}}
html.standalone{--safe-b:max(env(safe-area-inset-bottom,0px),26px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:var(--display);font-weight:400;letter-spacing:-.01em}
.pos{color:var(--in)} .neg{color:var(--out)} .muted{color:var(--muted)}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}

/* ---------- estructura ---------- */
.app{max-width:520px;margin:0 auto;padding-inline:18px;padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(var(--safe-b) + var(--tab-h) + 40px)}
.view{display:flex;flex-direction:column;gap:18px}
.topbar{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;min-height:44px}
.topbar h1{text-align:center;font-size:1.05rem;font-weight:600}
.iconbtn{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--bg-2)}
.iconbtn svg{width:22px;height:22px}

.hello{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hello small{color:var(--muted);font-size:.85rem}
.hello h1{font-family:var(--display);font-weight:400;font-size:2rem;line-height:1.1;margin-top:2px}
.hello p{margin:4px 0 0;color:var(--muted);font-size:.86rem}
.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:1.3rem;border:0;flex:none;box-shadow:var(--shadow)}

/* ---------- tarjeta principal ---------- */
.hero{position:relative;overflow:hidden;border-radius:var(--r);padding:18px 20px 16px;color:#fff;background:linear-gradient(140deg,var(--hero-a),var(--hero-b));box-shadow:0 12px 30px rgba(62,49,103,.28)}
.hero .lbl{font-size:.85rem;opacity:.85;display:flex;justify-content:space-between;align-items:center}
.hero .lbl button{background:none;border:0;color:#fff;opacity:.85;padding:4px;display:grid}
.hero .lbl svg{width:20px;height:20px}
.hero .amount{font-family:var(--display);font-size:2.35rem;line-height:1.1;margin:6px 0 4px;position:relative;z-index:1}
.hero .delta{font-size:.82rem;opacity:.9;position:relative;z-index:1}
.hero .delta b{font-weight:600}
.hero svg.spark{position:absolute;right:0;bottom:0;width:58%;height:46%;pointer-events:none;opacity:.9}
.hero .spark path.l{fill:none;stroke:rgba(255,255,255,.85);stroke-width:2}
.hero .spark path.a{fill:url(#hg)}
.privado .amt{filter:blur(9px)}

/* ---------- acciones rápidas ---------- */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.quick button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.78rem;color:var(--ink)}
.quick .q{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--primary)}
.quick .q.main{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.quick svg{width:22px;height:22px}

/* ---------- secciones ---------- */
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec-h h2{font-size:1.02rem}
.link{background:none;border:0;color:var(--muted);font-size:.84rem;display:inline-flex;align-items:center;gap:4px;padding:4px}
.link svg{width:14px;height:14px}
.box{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:6px 16px}
.box.pad{padding:16px}

/* filas de cuentas / listas */
.item{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.item:last-child{border-bottom:0}
.tile{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:600;font-size:.8rem}
.tile svg{width:22px;height:22px}
.item .t{min-width:0}
.item .t b{display:block;font-weight:600;font-size:.94rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--muted);font-size:.78rem;display:block}
.item .r{text-align:right;display:flex;align-items:center;gap:6px}
.item .r .v{font-weight:600;font-variant-numeric:tabular-nums}
.item .r small{display:block;color:var(--muted);font-size:.74rem;font-weight:400}
.item .chev{color:var(--faint);width:16px;height:16px}
.minibar{height:5px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-top:5px;width:110px;margin-left:auto}
.minibar i{display:block;height:100%;background:var(--c1)}
.minibar i.warn{background:var(--warn)}.minibar i.over{background:var(--out)}

.promo{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--primary-soft);border-radius:var(--r);padding:16px;border:0;text-align:left;width:100%}
.promo b{display:block;font-weight:600}
.promo small{color:var(--muted);font-size:.8rem}
.promo .go{width:36px;height:36px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center}
.promo .go svg,.promo .ic svg{width:18px;height:18px}
.promo .ic{color:var(--primary)}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat .h{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.8rem}
.stat .h svg{width:18px;height:18px;color:var(--primary)}
.stat .v{font-weight:600;font-size:1.12rem;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .d{font-size:.76rem}
.stat .bar{margin-top:2px}

/* segmented */
.segm{display:flex;background:var(--surface);border-radius:14px;padding:4px;gap:4px;box-shadow:var(--shadow)}
.segm button{flex:1;border:0;background:none;padding:8px 6px;border-radius:10px;font-size:.84rem;color:var(--muted);font-weight:500;white-space:nowrap}
.segm button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}

/* charts */
.chartcard{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.chartcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.chartcard .big{font-family:var(--display);font-size:2rem;line-height:1.1;margin:4px 0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--in);display:inline-block}
.pill.down i{background:var(--out)}
.chartsvg{width:100%;height:auto;display:block;overflow:visible}
.chartsvg .gl{stroke:var(--line);stroke-width:1}
.chartsvg .ax{fill:var(--faint);font-size:10.5px;font-family:var(--body)}
.chartsvg .l1{fill:none;stroke:var(--c1);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.chartsvg .l2{fill:none;stroke:var(--c2);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.chartsvg .dot1{fill:var(--c1);stroke:var(--surface);stroke-width:2}
.chartsvg .dot2{fill:var(--c2);stroke:var(--surface);stroke-width:2}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.legend b{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.donutwrap{display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:center}
@media (max-width:360px){.donutwrap{grid-template-columns:1fr;justify-items:center}}
.donut{position:relative;width:140px;height:140px}
.donut svg{width:140px;height:140px;transform:rotate(-90deg)}
.donut .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .c b{font-weight:600;font-size:1rem;font-variant-numeric:tabular-nums}
.donut .c small{color:var(--muted);font-size:.72rem}
.dlist{display:flex;flex-direction:column;gap:8px;min-width:0;width:100%}
.dlist div{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;font-size:.84rem}
.dlist i{width:9px;height:9px;border-radius:50%}
.dlist span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlist em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}

/* barras */
.bar{height:7px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c1);border-radius:99px}
.bar i.in{background:var(--in)} .bar i.warn{background:var(--warn)} .bar i.over{background:var(--out)}
.brow{display:flex;flex-direction:column;gap:6px}
.brow .t{display:flex;justify-content:space-between;gap:8px;font-size:.86rem}
.chip{display:inline-block;font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--in-soft);color:var(--in)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.over{background:var(--out-soft);color:var(--out)} .chip.pri{background:var(--primary-soft);color:var(--primary)}
.tag{display:inline-block;font-size:.66rem;padding:1px 6px;border-radius:6px;background:var(--primary-soft);color:var(--primary);font-weight:600;margin-left:4px;vertical-align:1px}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:12px;font-weight:500;font-size:.88rem}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.small{padding:6px 11px;font-size:.8rem;border-radius:10px}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--out)}
.btn.block{width:100%}

/* presupuesto */
.qsum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qsum div{background:var(--surface-2);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column}
.qsum span{font-size:.74rem;color:var(--muted)}
.qsum b{font-weight:600;font-variant-numeric:tabular-nums}
.qsec{display:flex;flex-direction:column}
.qsec>.label{display:flex;justify-content:space-between;font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:10px 0 6px;border-bottom:1px solid var(--line)}
.qrow{display:grid;grid-template-columns:1fr auto 84px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.qrow .n{min-width:0}
.qrow .n b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow .n small{color:var(--muted);font-size:.76rem}
.qrow .st{display:flex;justify-content:flex-end}
.qrow.paid .n b,.qrow.paid .num{color:var(--muted)}
.qempty{color:var(--faint);font-size:.84rem;padding:10px 0}
.crow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow small{display:block;color:var(--muted);font-size:.76rem}
.lim{display:grid;grid-template-columns:1fr 120px;gap:8px;align-items:center;padding:6px 0}
.lim input{text-align:right;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:7px 9px;width:100%}
.hint{font-size:.8rem;color:var(--muted);margin:0}

/* tarjetas (deudas, metas) */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card h3{font-size:1rem}
.card .sub{color:var(--muted);font-size:.8rem}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.kv div{display:flex;flex-direction:column}
.kv span{font-size:.74rem;color:var(--muted)}
.kv b{font-weight:600;font-variant-numeric:tabular-nums}
.card .foot{display:flex;gap:6px;flex-wrap:wrap}
.bigamt{font-family:var(--display);font-size:1.9rem;line-height:1.1}

/* tarjeta de crédito visual */
.cc{border-radius:var(--r);padding:18px;color:#fff;background:linear-gradient(135deg,#2F2550,#6A55A6);box-shadow:0 10px 26px rgba(62,49,103,.25);display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.cc:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.07)}
.cc .top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.cc .top small{opacity:.8;font-size:.78rem;display:block}
.cc .amts{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative;z-index:1}
.cc .amts span{font-size:.74rem;opacity:.8;display:block}
.cc .amts b{font-family:var(--display);font-weight:400;font-size:1.45rem}
.cc .bar{background:rgba(255,255,255,.2)} .cc .bar i{background:#fff}
.cc .bar i.warn{background:#FFC870} .cc .bar i.over{background:#FF8FA3}
.cc .foot{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;opacity:.9;position:relative;z-index:1}
.cc .btn{background:rgba(255,255,255,.15);border-color:transparent;color:#fff}

/* movimientos */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters input,.filters select{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 11px;min-width:0}
.filters input{flex:1 1 100%}
.filters select{flex:1}
.day{font-size:.74rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:14px 2px 4px}
.mrow{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.mrow:last-child{border-bottom:0}
.mrow .tile{width:40px;height:40px;border-radius:12px}
.mrow .t{min-width:0}
.mrow .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .t small{color:var(--muted);font-size:.76rem}
.mrow .v{font-weight:600;font-variant-numeric:tabular-nums}
.monthnav{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:4px}
.monthnav span{font-weight:600}
.empty{padding:28px 0;text-align:center;color:var(--muted)}
.banner{display:flex;flex-direction:column;gap:10px;background:var(--warn-soft);border-radius:16px;padding:14px 16px;font-size:.86rem}
.banner .btn{align-self:flex-start}

/* barra inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabbar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--tab-h);padding:6px 0 4px;font-size:.68rem;color:var(--faint);font-weight:500}
.tabbar button svg{width:23px;height:23px}
.tabbar button[aria-current="page"]{color:var(--primary)}

/* modal tipo hoja */
.overlay{position:fixed;inset:0;background:rgba(20,14,40,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:var(--surface);border-radius:24px 24px 0 0;width:min(520px,100%);max-height:92%;overflow:auto;padding:10px 20px calc(16px + var(--safe-b));display:flex;flex-direction:column;gap:14px}
.modal:before{content:"";width:40px;height:5px;border-radius:9px;background:var(--line);align-self:center}
@media (min-width:700px){.overlay{align-items:center}.modal{border-radius:24px}}
.modal h2{font-size:1.15rem}
.modal form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;font-size:16px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:9px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"].in{background:var(--surface);color:var(--in);box-shadow:var(--shadow)}
.seg button[aria-pressed="true"].out{background:var(--surface);color:var(--out);box-shadow:var(--shadow)}
.mfoot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.mfoot .btn{padding:12px}

<script>
(function(){
"use strict";
/* ================= constantes ================= */
const CAT_GASTO=["Vivienda","Comida","Transporte","Servicios","Suscripciones","Salud","Entretenimiento","Ropa","Educación","Deudas","Otros"];
const CAT_INGRESO=["Sueldo","Honorarios","Ventas","Inversiones","Otros ingresos"];
const TIPOS_CUENTA={debito:"Débito",efectivo:"Efectivo",credito:"Tarjeta de crédito",inversion:"Inversión"};
const TIPO_DEUDA={unico:"Pago único",msi:"Meses sin intereses",mensual:"Mensual",quincenal:"Quincenal",semanal:"Semanal"};
const PERIODO={unico:"pago único",msi:"al mes",mensual:"al mes",quincenal:"por quincena",semanal:"por semana"};
const DIAS=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const TABS=["inicio","movimientos","analisis","presupuesto","deudas","cuentas","metas","ajustes"].map(k=>[k]);
const MXN=new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN",minimumFractionDigits:2,maximumFractionDigits:2});
const MXN0=new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN",maximumFractionDigits:0});
const money=v=>MXN.format(v||0), money0=v=>MXN0.format(v||0);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,"0");
const r2=v=>Math.round((v+Number.EPSILON)*100)/100;
const sum=(a,f)=>a.reduce((t,x)=>t+(f?f(x):x),0);

/* ================= fechas y quincenas ================= */
/* Quincena del 15: del 15 al 29 (se paga con la nómina del 15).
   Quincena del 30: del 30 (o último día) al 14 del mes siguiente. */
const now=new Date();
const P=s=>s.split("-").map(Number);
const ds=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
const TODAY=ds(now.getFullYear(),now.getMonth()+1,now.getDate());
const lastDay=(y,m)=>new Date(y,m,0).getDate();
const q30=(y,m)=>Math.min(30,lastDay(y,m));
function nm(y,m,n){m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return[y,m]}
const mk=s=>s.slice(0,7);
function addMonths(M,n){const[y,m]=P(M);const[a,b]=nm(y,m,n);return`${a}-${pad(b)}`}
function qOf(s){const[y,m,d]=P(s);if(d<15){const[a,b]=nm(y,m,-1);return ds(a,b,30)}return ds(y,m,d>=q30(y,m)?30:15)}
function qStart(K){const[y,m,s]=P(K);return ds(y,m,s===15?15:q30(y,m))}
function qEnd(K){const[y,m,s]=P(K);if(s===15)return ds(y,m,q30(y,m)-1);const[a,b]=nm(y,m,1);return ds(a,b,14)}
function qNext(K){const[y,m,s]=P(K);if(s===15)return ds(y,m,30);const[a,b]=nm(y,m,1);return ds(a,b,15)}
function qPrev(K){const[y,m,s]=P(K);if(s===30)return ds(y,m,15);const[a,b]=nm(y,m,-1);return ds(a,b,30)}
const toD=s=>{const[y,m,d]=P(s);return new Date(y,m-1,d)};
const fromD=dt=>ds(dt.getFullYear(),dt.getMonth()+1,dt.getDate());
const shortDate=s=>toD(s).toLocaleDateString("es-MX",{day:"numeric",month:"short"}).replace(".","");
function qName(K){const[y,m,s]=P(K);return s===15?"Quincena del 15":`Quincena del ${q30(y,m)}`}
const qRange=K=>`${shortDate(qStart(K))} – ${shortDate(qEnd(K))}`;
function qFull(K){const[y,m]=P(K);return`${qName(K)} de ${new Date(y,m-1,1).toLocaleDateString("es-MX",{month:"long"})}`}
function monthName(M,short){const[y,m]=P(M);return new Date(y,m-1,1).toLocaleDateString("es-MX",short?{month:"short"}:{month:"long",year:"numeric"})}
const dayLabel=d=>toD(d).toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long"});
const CURQ=qOf(TODAY);

function monthlyIn(dia,K){const[y,m]=P(K);const out=[];for(const n of[0,1]){const[a,b]=nm(y,m,n);const d=ds(a,b,Math.min(dia||1,lastDay(a,b)));if(qOf(d)===K)out.push(d)}return out}
function weeklyIn(wd,K){const out=[];const dt=toD(qStart(K)),end=toD(qEnd(K));while(dt<=end){if(dt.getDay()===Number(wd))out.push(fromD(dt));dt.setDate(dt.getDate()+1)}return out}
function occDeuda(d,K,base){
  if(d.tipo!=="unico"&&d.desde)return occDeudaRaw(d,K,base).filter(x=>x>=d.desde);
  return occDeudaRaw(d,K,base);
}
function occDeudaRaw(d,K,base){
  switch(d.tipo){
    case"mensual":case"msi":return monthlyIn(d.dia,K);
    case"quincenal":return[qStart(K)];
    case"semanal":return weeklyIn(d.diaSemana,K);
    case"unico":{const k=qOf(d.fecha);if(k===K)return[d.fecha];if(K===base&&k<base)return[d.fecha];return[]}
  }return[];
}
const occFijo=(f,K)=>f.frecuencia==="quincenal"?[qStart(K)]:monthlyIn(f.dia,K);
const occIngreso=(i,K)=>(i.quincena==="ambas"||i.quincena===K.slice(8))?[qStart(K)]:[];

/* ================= estado ================= */
let S=null, mes=mk(TODAY), tab="inicio", filtro={tipo:"todos",cat:"",q:""};
try{let h=location.hash.slice(1);if(h==="presupuestos")h="presupuesto";if(h==="resumen")h="inicio";if(TABS.some(t=>t[0]===h))tab=h}catch(e){}
const LS="misFinanzas.v1";
function readLocal(){try{const r=localStorage.getItem(LS);return r?JSON.parse(r):null}catch(e){return null}}
function writeLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast("No se pudo guardar: el almacenamiento está lleno o bloqueado")}}
function modify(){writeLocal();render()}

/* ================= cálculos ================= */
const linked=(f,id,K)=>S.movimientos.filter(x=>x[f]===id&&(K===undefined||x.q===K));
const pagadoDeuda=d=>r2(sum(linked("deudaId",d.id),x=>x.monto));
const tarjetaDe=d=>S.cuentas.find(c=>c.tipo==="credito"&&c.deudaId===d.id);
const esTarjeta=id=>{const c=S.cuentas.find(x=>x.id===id);return!!c&&c.tipo==="credito"};
/* Compras con la tarjeta (registradas después de vincularla) suben el saldo; devoluciones lo bajan. */
function cargos(d){const c=tarjetaDe(d);if(!c)return 0;return r2(sum(S.movimientos.filter(x=>x.cuentaId===c.id&&x.deudaId!==d.id&&(x.ts||0)>=(c.vinculoTs||0)&&x.ts),x=>x.tipo==="gasto"?x.monto:-x.monto))}
const saldo=d=>Math.max(0,r2(d.montoInicial+cargos(d)-pagadoDeuda(d)));
function adeudoTarjeta(c){const d=c.deudaId&&S.deudas.find(x=>x.id===c.deudaId);return d?saldo(d):Math.max(0,-saldoCuenta(c))}
const hechos=d=>(d.pagosPrevios||0)+linked("deudaId",d.id).length;
function restantes(d){const s=saldo(d);if(s<=0.005)return 0;if(d.tipo==="msi")return Math.max(0,d.pagosTotales-hechos(d));if(d.tipo==="unico")return 1;return Math.ceil(s/d.pago-1e-9)}
/* Pagos pendientes de una deuda en la quincena K, proyectando desde la quincena base (la actual). */
function pendDeuda(d,K,base){
  if(K<base)return[];
  let rem=restantes(d),left=saldo(d),k=base,guard=0;
  while(rem>0&&k<=K&&guard++<400){
    const occ=occDeuda(d,k,base),paid=linked("deudaId",d.id,k).length;
    const take=Math.min(Math.max(0,occ.length-paid),rem);
    if(k===K){const rows=[];for(let i=0;i<take;i++){const amt=d.tipo==="unico"?left:Math.min(d.pago,left);rows.push({fecha:occ[Math.min(paid+i,occ.length-1)],monto:r2(amt)});left-=amt}return rows}
    rem-=take;left=d.tipo==="unico"?(take?0:left):Math.max(0,left-take*d.pago);k=qNext(k);
  }
  return[];
}
function sigPago(d){if(saldo(d)<=0.005)return null;let k=CURQ;for(let i=0;i<60;i++){const r=pendDeuda(d,k,CURQ);if(r.length)return{q:k,...r[0]};k=qNext(k)}return null}

function filas(items,occFn,field,K,montoFn){
  const out=[];
  items.forEach(it=>{
    const occ=occFn(it,K),paid=linked(field,it.id,K);
    paid.forEach(m=>out.push({item:it,fecha:m.fecha,monto:m.monto,paid:true}));
    for(let i=paid.length;i<occ.length;i++)out.push({item:it,fecha:occ[i],monto:montoFn(it),paid:false});
  });
  return out.sort((a,b)=>a.fecha.localeCompare(b.fecha));
}
function quincena(K){
  const ingresos=filas(S.ingresosFijos,occIngreso,"ingresoId",K,i=>i.monto);
  const fijos=filas(S.fijos,occFijo,"fijoId",K,f=>f.monto);
  const deudas=[];
  S.deudas.forEach(d=>{
    linked("deudaId",d.id,K).forEach(m=>deudas.push({item:d,fecha:m.fecha,monto:m.monto,paid:true}));
    pendDeuda(d,K,CURQ).forEach(r=>deudas.push({item:d,fecha:r.fecha,monto:r.monto,paid:false}));
  });
  deudas.sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const a=qStart(K),b=qEnd(K);
  const gastoVar={};
  S.movimientos.forEach(x=>{if(x.tipo==="gasto"&&!x.deudaId&&!x.fijoId&&x.fecha>=a&&x.fecha<=b)gastoVar[x.categoria]=(gastoVar[x.categoria]||0)+x.monto});
  const ingreso=sum(ingresos,x=>x.monto);
  const comp=[...fijos,...deudas];
  const compromisos=sum(comp,x=>x.monto), pagado=sum(comp.filter(x=>x.paid),x=>x.monto);
  const variables=sum(Object.values(S.limites||{}),v=>+v||0);
  return{K,ingresos,fijos,deudas,gastoVar,ingreso,compromisos,pagado,porPagar:r2(compromisos-pagado),variables,disponible:r2(ingreso-compromisos-variables)};
}
const movsMes=M=>S.movimientos.filter(x=>mk(x.fecha)===M);
function totales(M){let i=0,g=0;movsMes(M).forEach(x=>{if(esTarjeta(x.cuentaId))return;x.tipo==="ingreso"?i+=x.monto:g+=x.monto});return{i,g,b:i-g}}
function saldoCuenta(c){let s=Number(c.saldoInicial)||0;S.movimientos.forEach(x=>{if(x.cuentaId===c.id)s+=x.tipo==="ingreso"?x.monto:-x.monto});return s}
function mesesHasta(f){const[y,m]=P(f);return(y-now.getFullYear())*12+(m-(now.getMonth()+1))}

/* ================= datos de ejemplo / migración ================= */
function vacio(){return{v:2,nombre:"Brandon",ejemplo:false,cuentas:[{id:uid(),nombre:"Efectivo",tipo:"efectivo",saldoInicial:0}],movimientos:[],ingresosFijos:[],fijos:[],deudas:[],limites:{},metas:[]}}
function ejemplo(){
  let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};
  const hoy=toD(TODAY);const unico=new Date(hoy);unico.setDate(unico.getDate()+26);
  const s={v:2,nombre:"Brandon",ejemplo:true,
    cuentas:[{id:"c1",nombre:"Cuenta de nómina",tipo:"debito",saldoInicial:6000},{id:"c2",nombre:"Efectivo",tipo:"efectivo",saldoInicial:7000},{id:"c3",nombre:"Ahorro",tipo:"inversion",saldoInicial:20000},{id:"c4",nombre:"TDC Oro",tipo:"credito",saldoInicial:0,limite:40000,deudaId:"d1",vinculoTs:1}],
    ingresosFijos:[{id:"i1",nombre:"Nómina",monto:12500,categoria:"Sueldo",quincena:"ambas"}],
    fijos:[
      {id:"f1",nombre:"Renta",monto:4500,categoria:"Vivienda",frecuencia:"mensual",dia:1},
      {id:"f2",nombre:"Celular",monto:847.01,categoria:"Servicios",frecuencia:"mensual",dia:18},
      {id:"f3",nombre:"Internet",monto:544.50,categoria:"Servicios",frecuencia:"mensual",dia:22},
      {id:"f4",nombre:"Streaming",monto:124,categoria:"Suscripciones",frecuencia:"mensual",dia:13}],
    deudas:[
      {id:"d1",nombre:"TDC Oro",acreedor:"Banco",tipo:"mensual",pago:2100,dia:30,montoInicial:42000},
      {id:"d2",nombre:"Celular a 18 MSI",acreedor:"Tienda",tipo:"msi",pago:1188,pagosTotales:18,pagosPrevios:3,dia:15,montoInicial:1188*15},
      {id:"d3",nombre:"Préstamo en app",acreedor:"App de préstamos",tipo:"semanal",pago:450,diaSemana:5,montoInicial:4500},
      {id:"d4",nombre:"Tienda departamental",acreedor:"Tienda",tipo:"quincenal",pago:750,montoInicial:12000},
      {id:"d5",nombre:"Préstamo familiar",acreedor:"Familiar",tipo:"unico",pago:5000,fecha:fromD(unico),montoInicial:5000}],
    limites:{Comida:2500,Transporte:1200,Entretenimiento:600,Otros:400},
    metas:[{id:"m1",nombre:"Fondo de emergencia",objetivo:60000,ahorrado:20000,fecha:"2027-06-30"},{id:"m2",nombre:"Viaje de diciembre",objetivo:15000,ahorrado:6000,fecha:"2026-12-10"}],
    movimientos:[]};
  const prev=S;S=s;
  const add=o=>s.movimientos.push({id:uid(),cuentaId:"c1",...o});
  let K=ds(...P(addMonths(mk(TODAY),-5)),15).slice(0,10);
  const debtStart="0000";
  while(K<=CURQ){
    s.ingresosFijos.forEach(i=>occIngreso(i,K).forEach(f=>{if(f<=TODAY)add({tipo:"ingreso",monto:i.monto,fecha:f,categoria:i.categoria,nota:i.nombre,q:K,ingresoId:i.id})}));
    s.fijos.forEach(fj=>occFijo(fj,K).forEach(f=>{if(f<=TODAY)add({tipo:"gasto",monto:fj.monto,fecha:f,categoria:fj.categoria,nota:fj.nombre,q:K,fijoId:fj.id})}));
    if(K>=debtStart)s.deudas.forEach(d=>pendDeuda(d,K,K).forEach(r=>{if(r.fecha<=TODAY)add({tipo:"gasto",monto:r.monto,fecha:r.fecha,categoria:"Deudas",nota:d.nombre,q:K,deudaId:d.id})}));
    const a=toD(qStart(K)),len=Math.round((toD(qEnd(K))-a)/864e5)+1;
    Object.entries(s.limites).forEach(([c,l])=>{const n=c==="Comida"?4:2;for(let j=0;j<n;j++){const dt=new Date(a);dt.setDate(a.getDate()+Math.floor(rnd()*len));const f=fromD(dt);if(f<=TODAY)add({tipo:"gasto",monto:Math.round(l/n*(0.6+rnd()*0.5)),fecha:f,categoria:c,nota:{Comida:rnd()>.5?"Súper":"Mercado",Transporte:"Gasolina",Entretenimiento:"Salida",Otros:"Varios"}[c],cuentaId:rnd()>.85?"c2":"c1"})}});
    if(K.endsWith("15")&&rnd()>.4){const f=fromD(new Date(a.getFullYear(),a.getMonth(),a.getDate()+3));if(f<=TODAY)add({tipo:"ingreso",monto:1500+Math.round(rnd()*3000),fecha:f,categoria:"Ventas",nota:"Venta de artículos"})}
    K=qNext(K);
  }
  const c1=fromD(new Date(toD(qStart(CURQ)).getTime()+2*864e5));if(c1<=TODAY)add({tipo:"gasto",monto:1350,fecha:c1,categoria:"Ropa",nota:"Compra con tarjeta",cuentaId:"c4",ts:1});
  S=prev;return s;
}
function migrar(o){
  if(!o||typeof o!=="object")return null;
  if(o.v===2)return Object.assign(vacio(),o);
  if(o.ejemplo)return ejemplo();
  const n=vacio();n.cuentas=o.cuentas&&o.cuentas.length?o.cuentas:n.cuentas;n.movimientos=o.movimientos||[];n.metas=o.metas||[];
  Object.entries(o.presupuestos||{}).forEach(([c,v])=>{if(c!=="Vivienda"&&c!=="Deudas"&&v)n.limites[c]=Math.round(v/2)});
  n.deudas=(o.deudas||[]).map(d=>{const rest=Math.max(0,(d.pagosTotales||0)-(d.pagosHechos||0));const base={id:d.id,nombre:d.nombre,acreedor:d.acreedor||"",pago:d.pago,dia:d.dia||1,diaSemana:5,desde:TODAY,montoInicial:r2(rest*d.pago)};
    return d.frecuencia==="mensual"&&d.pagosTotales>1?{...base,tipo:"msi",pagosTotales:d.pagosTotales,pagosPrevios:d.pagosHechos||0}:{...base,tipo:d.frecuencia||"mensual"}});
  return n;
}

function niceStep(x){if(x<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(x)));const f=x/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function estadoLim(g,l){if(!l)return["","Sin límite"];const p=g/l;if(p>1)return["over","Excedido"];if(p>=.85)return["warn","Cerca del límite"];return["ok","En rango"]}

/* ---------- series y gráficas ---------- */
const cashIds=()=>new Set(S.cuentas.filter(c=>c.tipo!=="credito").map(c=>c.id));
function cashAt(date,ids){ids=ids||cashIds();let s=sum(S.cuentas.filter(c=>ids.has(c.id)),c=>+c.saldoInicial||0);S.movimientos.forEach(x=>{if(ids.has(x.cuentaId)&&x.fecha<=date)s+=x.tipo==="ingreso"?x.monto:-x.monto});return s}
function addDays(s,n){const d=toD(s);d.setDate(d.getDate()+n);return fromD(d)}
function cashSeries(from,step){const ids=cashIds(),pts=[];let d=from;while(d<TODAY){pts.push([d,cashAt(d,ids)]);d=addDays(d,step)}pts.push([TODAY,cashAt(TODAY,ids)]);return pts}
function sparkSVG(vals){
  const W=200,H=80,mn=Math.min(...vals),mx=Math.max(...vals),rg=mx-mn||1;
  const P=vals.map((v,i)=>[i/(vals.length-1||1)*W,H-6-(v-mn)/rg*(H-20)]);
  const l="M"+P.map(p=>p.map(n=>n.toFixed(1)).join(",")).join(" L");
  return`<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="hg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><path class="a" d="${l} L${W},${H} L0,${H} Z"/><path class="l" d="${l}"/></svg>`;
}
let gid=0;
function lineChart(series,labels,opts){
  opts=opts||{};const W=320,H=opts.h||150,L=38,R=10,T=10,B=22;
  const all=series.flatMap(s=>s.vals);let mn=opts.zero?0:Math.min(...all),mx=Math.max(...all);if(mx===mn){mx+=1;mn-=opts.zero?0:1}
  const step=niceStep((mx-mn)/3),lo=opts.zero?0:Math.floor(mn/step)*step,hi=Math.ceil(mx/step)*step;
  const n=labels.length,x=i=>L+(n<=1?0:i/(n-1)*(W-L-R)),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo||1));
  let s=`<svg class="chartsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||"Gráfica de líneas")}"><defs>`;
  series.forEach((se,k)=>{s+=`<linearGradient id="lg${gid}_${k}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:${se.color};stop-opacity:.22"/><stop offset="1" style="stop-color:${se.color};stop-opacity:0"/></linearGradient>`});
  s+="</defs>";
  for(let v=lo;v<=hi+1e-6;v+=step){s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="ax" x="${L-6}" y="${(y(v)+3.5).toFixed(1)}" text-anchor="end">${fmtK(v)}</text>`}
  const every=Math.max(1,Math.ceil(n/5));
  labels.forEach((lb,i)=>{if(i%every===0||i===n-1){if(i!==n-1&&n-1-i<every*0.6)return;s+=`<text class="ax" x="${x(i).toFixed(1)}" y="${H-5}" text-anchor="${i===0?"start":i===n-1?"end":"middle"}">${esc(lb)}</text>`}});
  series.forEach((se,k)=>{
    const pts=se.vals.map((v,i)=>[x(i),y(v)]);const d="M"+pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" L");
    if(se.area)s+=`<path d="${d} L${x(n-1).toFixed(1)},${y(lo).toFixed(1)} L${x(0).toFixed(1)},${y(lo).toFixed(1)} Z" fill="url(#lg${gid}_${k})"/>`;
    s+=`<path d="${d}" style="fill:none;stroke:${se.color};stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round"/>`;
    const e=pts[pts.length-1];s+=`<circle cx="${e[0].toFixed(1)}" cy="${e[1].toFixed(1)}" r="4" style="fill:${se.color};stroke:var(--surface);stroke-width:2"/>`;
  });
  gid++;return s+"</svg>";
}
function fmtK(v){const a=Math.abs(v);return(v<0?"-":"")+(a>=1e6?(a/1e6).toFixed(1).replace(".0","")+"M":a>=1000?(a/1000).toFixed(a>=1e4?0:1).replace(".0","")+"k":Math.round(a))}
function donut(items,center,sub){
  const tot=sum(items,i=>i.v),r=52,C=2*Math.PI*r;let acc=0;
  let s=`<svg viewBox="0 0 140 140" role="img" aria-label="${esc(sub)}"><circle cx="70" cy="70" r="${r}" fill="none" style="stroke:var(--surface-2)" stroke-width="18"/>`;
  if(tot>0)items.forEach(it=>{const len=it.v/tot*C,g=items.length>1&&len>4?2:0;s+=`<circle cx="70" cy="70" r="${r}" fill="none" style="stroke:${it.c}" stroke-width="18" stroke-dasharray="${(len-g).toFixed(2)} ${(C-len+g).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}"/>`;acc+=len});
  s+="</svg>";
  const list=items.map(it=>`<div><i style="background:${it.c}"></i><span>${esc(it.l)}</span><em>${tot?Math.round(it.v/tot*100):0}%</em></div>`).join("");
  return`<div class="donutwrap"><div class="donut">${s}<div class="c"><b class="amt">${center}</b><small>${esc(sub)}</small></div></div><div class="dlist">${list||'<span class="muted">Sin datos</span>'}</div></div>`;
}
function topN(map,n){const e=Object.entries(map).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);const top=e.slice(0,n),rest=e.slice(n);const out=top.map(([l,v],i)=>({l,v,c:PAL[i%PAL.length]}));if(rest.length)out.push({l:"Otros",v:sum(rest,x=>x[1]),c:"var(--c7)"});return out}

function consumo(x,linkedCard){return x.tipo==="gasto"&&!(x.deudaId&&linkedCard.has(x.deudaId))}

  const cats=topN(porCat,5),gastoTot=sum(Object.values(porCat));

  const mt=ms.map(totales);

  return`${topbar("Análisis")}

  </div>

/* ================= modales ================= */
function openModal(title,body,onSubmit){
  const root=document.getElementById("modalRoot");
  root.innerHTML=`<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">${esc(title)}</h2><form id="mf" novalidate>${body}<p class="err" id="mErr" hidden></p><div class="mfoot"><button type="button" class="btn" id="mCancel">Cancelar</button><button type="submit" class="btn primary">Guardar</button></div></form></div></div>`;
  const f=document.getElementById("mf");
  f.addEventListener("submit",e=>{e.preventDefault();const fd=Object.fromEntries(new FormData(f));const err=onSubmit(fd,f);if(err){const el=document.getElementById("mErr");el.textContent=err;el.hidden=false}else closeModal()});
  document.getElementById("mCancel").onclick=closeModal;
  document.getElementById("ov").addEventListener("mousedown",e=>{if(e.target.id==="ov")closeModal()});
}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
const num=v=>{const n=parseFloat(String(v??"").replace(/[,$\s]/g,""));return isFinite(n)?n:NaN};
const opt=(arr,sel)=>arr.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(sel)?"selected":""}>${esc(l)}</option>`).join("");
const cuentaOpts=sel=>opt(S.cuentas.map(c=>[c.id,c.nombre]),sel);
function qOpts(sel){let k=qPrev(qPrev(sel));const o=[];for(let i=0;i<5;i++){o.push([k,`${qFull(k)} (${qRange(k)})`]);k=qNext(k)}return opt(o,sel)}
function field(id,label,input,extra){return`<div class="field" ${extra||""}><label for="${id}">${label}</label>${input}</div>`}

function movForm(m){
  const tipo=m?m.tipo:"gasto",catOpts=t=>(t==="ingreso"?CAT_INGRESO:CAT_GASTO).map(c=>[c,c]);

   <div class="seg"><button type="button" class="out" data-seg="gasto" aria-pressed="${tipo==="gasto"}">Gasto</button><button type="button" class="in" data-seg="ingreso" aria-pressed="${tipo==="ingreso"}">Ingreso</button></div>
   <div class="frow">${field("mvMonto","Monto (MXN)",`<input id="mvMonto" name="monto" inputmode="decimal" value="${m?m.monto:""}" placeholder="0.00">`)}${field("mvFecha","Fecha",`<input id="mvFecha" type="date" name="fecha" value="${m?m.fecha:(mk(TODAY)===mes?TODAY:mes+"-01")}">`)}</div>
   <div class="frow">${field("mvCat","Categoría",`<select id="mvCat" name="categoria">${opt(catOpts(tipo),m&&m.categoria)}</select>`)}${field("mvCuenta","Cuenta",`<select id="mvCuenta" name="cuentaId">${cuentaOpts(m&&m.cuentaId)}</select>`)}</div>
   ${field("mvNota","Descripción",`<input id="mvNota" name="nota" value="${esc(m?m.nota:"")}" placeholder="Ej. Súper, gasolina, venta…">`)}
   ${m&&(m.deudaId||m.fijoId||m.ingresoId)?'<p class="hint">Este movimiento está ligado a tu presupuesto. Si lo eliminas, vuelve a aparecer como pendiente.</p>':""}
   ${m?`<button type="button" class="btn ghost danger" data-del-mov="${m.id}">Eliminar movimiento</button>`:""}`,fd=>{
    const monto=num(fd.monto);if(!(monto>0))return"Escribe un monto mayor a cero.";if(!fd.fecha)return"Elige una fecha.";if(!fd.cuentaId)return"Crea primero una cuenta en la pestaña Cuentas.";
    const rec={...(m||{id:uid(),ts:Date.now()}),tipo:fd.tipo,monto:r2(monto),fecha:fd.fecha,categoria:fd.categoria,cuentaId:fd.cuentaId,nota:fd.nota.trim()};
    if(m)S.movimientos=S.movimientos.map(x=>x.id===m.id?rec:x);else{S.movimientos.push(rec);mes=mk(rec.fecha)}

   ${field("pQ","Corresponde a",`<select id="pQ" name="q">${qOpts(o.q)}</select>`)}

async function save(filename,data){

  try{const file=new File([blob],filename,{type});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});markBackup();return}}catch(e){if(e&&e.name==="AbortError")return}
  const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);markBackup();
}
function markBackup(){try{localStorage.setItem(LS+".respaldo",TODAY)}catch(e){}render()}

const expCsv=()=>{
  const cn=Object.fromEntries(S.cuentas.map(c=>[c.id,c.nombre])),q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const rows=[["Fecha","Tipo","Categoría","Descripción","Cuenta","Quincena","Monto"].join(",")].concat(S.movimientos.slice().sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(x=>[x.fecha,x.tipo,q(x.categoria),q(x.nota),q(cn[x.cuentaId]),q(qFull(x.q||qOf(x.fecha))),(x.tipo==="gasto"?-x.monto:x.monto).toFixed(2)].join(",")));
  save(`movimientos-${TODAY}.csv`,"﻿"+rows.join("\n"));
};
document.getElementById("impFile").onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=migrar(JSON.parse(r.result));if(!d||!Array.isArray(d.movimientos))throw 0;
    confirmBox("Importar respaldo",`Se reemplazarán tus datos actuales con ${d.movimientos.length} movimientos y ${d.deudas.length} deudas del archivo.`,"Importar",()=>{S=d;S.ejemplo=false;modify();markBackup();toast("Respaldo importado")});
  }catch(_){toast("El archivo no es un respaldo válido de Mis Finanzas")}e.target.value=""};
  r.readAsText(f);
};
