<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1311" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mis Finanzas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Mis Finanzas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html{color-scheme:light;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --surface-2:#EAEEEA; --line:#D9E0DB;
  --ink:#15201B; --muted:#5B6A63; --faint:#8A9791;
  --accent:#0E6B5A; --accent-ink:#FFFFFF; --accent-soft:#DCEEE8;
  --in:#1B7F45; --in-soft:#DDF1E4; --out:#B8412C; --out-soft:#F8E3DE;
  --warn:#A86A12; --warn-soft:#F7EBD4;
  --shadow:0 1px 2px rgba(21,32,27,.06),0 4px 16px rgba(21,32,27,.05);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1311; --surface:#151D1A; --surface-2:#1C2622; --line:#2A3631;
    --ink:#E4EBE7; --muted:#9AA9A2; --faint:#6D7C75;
    --accent:#4CC3A5; --accent-ink:#06231C; --accent-soft:#16332B;
    --in:#5FD08E; --in-soft:#15301F; --out:#F08A72; --out-soft:#3A1E18;
    --warn:#E3AE55; --warn-soft:#352A15;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.2);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1311; --surface:#151D1A; --surface-2:#1C2622; --line:#2A3631;
  --ink:#E4EBE7; --muted:#9AA9A2; --faint:#6D7C75;
  --accent:#4CC3A5; --accent-ink:#06231C; --accent-soft:#16332B;
  --in:#5FD08E; --in-soft:#15301F; --out:#F08A72; --out-soft:#3A1E18;
  --warn:#E3AE55; --warn-soft:#352A15;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.2);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1080px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:20px 12px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:1.6rem;font-weight:700}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:1.1rem}
.toprow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.monthnav{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.monthnav button{background:none;border:0;padding:8px 12px;cursor:pointer;color:var(--muted);font-size:1.05rem}
.monthnav button:hover{color:var(--ink)}
.monthnav span{min-width:128px;text-align:center;font-weight:600}
.status{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.dot.ok{background:var(--in)} .dot.busy{background:var(--warn)} .dot.err{background:var(--out)}

/* tabs */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding-block:8px;margin-bottom:16px;border-bottom:1px solid var(--line);scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}

/* banner */
.banner{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:.9rem}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;font-size:.9rem}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:5px 10px;font-size:.82rem}
.btn.danger{color:var(--out)}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}

/* layout */
.grid{display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-size:1.35rem;font-weight:500}
.kpi .s{font-size:.8rem;color:var(--muted)}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pos{color:var(--in)} .neg{color:var(--out)}

/* bars */
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar i.warn{background:var(--warn)} .bar i.over{background:var(--out)} .bar i.in{background:var(--in)}
.brow{display:flex;flex-direction:column;gap:6px}
.brow .t{display:flex;justify-content:space-between;gap:8px;font-size:.9rem}
.chip{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.chip.ok{background:var(--in-soft);color:var(--in)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.over{background:var(--out-soft);color:var(--out)}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-family:var(--mono);font-size:11px}
.chart .b-in{fill:var(--in)} .chart .b-out{fill:var(--out)}
.chart .cur{fill:var(--accent-soft)}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* list */
.list{display:flex;flex-direction:column}
.day{font-size:.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:14px 0 6px;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:36px 1fr auto auto;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:.8rem;font-family:var(--display)}
.ic.in{background:var(--in-soft);color:var(--in)} .ic.out{background:var(--out-soft);color:var(--out)}
.row .d{min-width:0}
.row .d b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .d small{color:var(--muted);font-size:.8rem}
.row .acts{display:flex;gap:2px}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters input,.filters select{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px;min-width:0}
.filters input{flex:1 1 180px}
.empty{padding:28px 0;text-align:center;color:var(--muted)}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.kv div{display:flex;flex-direction:column}
.kv span{font-size:.75rem;color:var(--muted)}
.card .foot{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}

/* budget table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
td input{width:110px;text-align:right;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 8px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(8,14,12,.5);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:16px;width:min(460px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:7px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"].in{background:var(--surface);color:var(--in);box-shadow:var(--shadow)}
.seg button[aria-pressed="true"].out{background:var(--surface);color:var(--out);box-shadow:var(--shadow)}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.err{color:var(--out);font-size:.85rem}

.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;border-radius:99px;padding:14px 20px;box-shadow:0 8px 24px rgba(14,107,90,.35);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:.88rem;z-index:60}
.footer-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px;padding-top:16px;border-top:1px solid var(--line);align-items:center}
@media (max-width:520px){
  .row{grid-template-columns:32px 1fr auto}
  .row .acts{grid-column:2 / -1;justify-content:flex-end;margin-top:-6px}
  .frow{grid-template-columns:1fr}
  .monthnav span{min-width:104px}
}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}}
/* v2: presupuesto quincenal */
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.qgrid{grid-template-columns:1fr}}
.qpanel.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.qsum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.qsum div{display:flex;flex-direction:column;min-width:0}
.qsum span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.qsum b{font-family:var(--mono);font-weight:500;font-size:.92rem;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.qsum{grid-template-columns:1fr 1fr}}
.qsec{display:flex;flex-direction:column}
.qsec>.label{padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.qrow{display:grid;grid-template-columns:1fr auto 92px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.qrow .n{min-width:0}
.qrow .n b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow .n small{color:var(--muted);font-size:.78rem}
.qrow .st{display:flex;justify-content:flex-end}
.qrow.paid .n b,.qrow.paid .num{color:var(--muted)}
.qempty{color:var(--faint);font-size:.85rem;padding:8px 0}
.kpi .bar{margin-top:6px}
.tag{display:inline-block;font-size:.7rem;padding:1px 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:600;margin-left:4px;vertical-align:1px}
.cfg{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:980px){.cfg{grid-template-columns:1fr}}
.crow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow small{display:block;color:var(--muted);font-size:.78rem}
.lim{display:grid;grid-template-columns:1fr 120px;gap:8px;align-items:center;padding:5px 0}
.lim input{text-align:right;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:100%}
.hint{font-size:.8rem;color:var(--muted);margin:0}
.big{font-size:1.5rem}
.chip{white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="mark">$</div><h1>Mis Finanzas</h1></div>
    <div class="toprow">
      <div class="monthnav">
        <button id="mPrev" aria-label="Mes anterior">‹</button>
        <span id="mLabel"></span>
        <button id="mNext" aria-label="Mes siguiente">›</button>
      </div>
    </div>
  </header>
  <div class="status" id="status"><span class="dot ok"></span><span>Guardado en este celular</span></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div id="banner"></div>
  <main id="view"></main>
  <div class="footer-tools">
    <span class="label" style="margin-right:4px">Respaldo</span>
    <button class="btn small" id="expJson">Exportar respaldo (.json)</button>
    <button class="btn small" id="expCsv">Exportar movimientos (.csv)</button>
    <label class="btn small" for="impFile">Importar respaldo</label>
    <input type="file" id="impFile" accept=".json,application/json" hidden>
    <button class="btn small ghost danger" id="resetBtn">Borrar todo</button>
  </div>
</div>
<button class="btn primary fab" id="fab">+ Movimiento</button>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
(function(){
"use strict";
/* ================= constantes ================= */
const CAT_GASTO=["Vivienda","Comida","Transporte","Servicios","Suscripciones","Salud","Entretenimiento","Ropa","Educación","Deudas","Otros"];
const CAT_INGRESO=["Sueldo","Honorarios","Ventas","Inversiones","Otros ingresos"];
const TIPOS_CUENTA={debito:"Débito",efectivo:"Efectivo",credito:"Tarjeta de crédito",inversion:"Inversión"};
const TIPO_DEUDA={unico:"Pago único",msi:"Meses sin intereses",mensual:"Mensual",quincenal:"Quincenal",semanal:"Semanal"};
const PERIODO={unico:"pago único",msi:"al mes",mensual:"al mes",quincenal:"por quincena",semanal:"por semana"};
const DIAS=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const TABS=[["resumen","Resumen"],["presupuesto","Presupuesto"],["movimientos","Movimientos"],["deudas","Deudas"],["metas","Metas"],["cuentas","Cuentas"]];
const MXN=new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN",minimumFractionDigits:2,maximumFractionDigits:2});
const MXN0=new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN",maximumFractionDigits:0});
const money=v=>MXN.format(v||0), money0=v=>MXN0.format(v||0);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,"0");
const r2=v=>Math.round((v+Number.EPSILON)*100)/100;
const sum=(a,f)=>a.reduce((t,x)=>t+(f?f(x):x),0);

/* ================= fechas y quincenas ================= */
/* Quincena del 15: del 15 al 29 (se paga con la nómina del 15).
   Quincena del 30: del 30 (o último día) al 14 del mes siguiente. */
const now=new Date();
const P=s=>s.split("-").map(Number);
const ds=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
const TODAY=ds(now.getFullYear(),now.getMonth()+1,now.getDate());
const lastDay=(y,m)=>new Date(y,m,0).getDate();
const q30=(y,m)=>Math.min(30,lastDay(y,m));
function nm(y,m,n){m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return[y,m]}
const mk=s=>s.slice(0,7);
function addMonths(M,n){const[y,m]=P(M);const[a,b]=nm(y,m,n);return`${a}-${pad(b)}`}
function qOf(s){const[y,m,d]=P(s);if(d<15){const[a,b]=nm(y,m,-1);return ds(a,b,30)}return ds(y,m,d>=q30(y,m)?30:15)}
function qStart(K){const[y,m,s]=P(K);return ds(y,m,s===15?15:q30(y,m))}
function qEnd(K){const[y,m,s]=P(K);if(s===15)return ds(y,m,q30(y,m)-1);const[a,b]=nm(y,m,1);return ds(a,b,14)}
function qNext(K){const[y,m,s]=P(K);if(s===15)return ds(y,m,30);const[a,b]=nm(y,m,1);return ds(a,b,15)}
function qPrev(K){const[y,m,s]=P(K);if(s===30)return ds(y,m,15);const[a,b]=nm(y,m,-1);return ds(a,b,30)}
const toD=s=>{const[y,m,d]=P(s);return new Date(y,m-1,d)};
const fromD=dt=>ds(dt.getFullYear(),dt.getMonth()+1,dt.getDate());
const shortDate=s=>toD(s).toLocaleDateString("es-MX",{day:"numeric",month:"short"}).replace(".","");
function qName(K){const[y,m,s]=P(K);return s===15?"Quincena del 15":`Quincena del ${q30(y,m)}`}
const qRange=K=>`${shortDate(qStart(K))} – ${shortDate(qEnd(K))}`;
function qFull(K){const[y,m]=P(K);return`${qName(K)} de ${new Date(y,m-1,1).toLocaleDateString("es-MX",{month:"long"})}`}
function monthName(M,short){const[y,m]=P(M);return new Date(y,m-1,1).toLocaleDateString("es-MX",short?{month:"short"}:{month:"long",year:"numeric"})}
const dayLabel=d=>toD(d).toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long"});
const CURQ=qOf(TODAY);

function monthlyIn(dia,K){const[y,m]=P(K);const out=[];for(const n of[0,1]){const[a,b]=nm(y,m,n);const d=ds(a,b,Math.min(dia||1,lastDay(a,b)));if(qOf(d)===K)out.push(d)}return out}
function weeklyIn(wd,K){const out=[];const dt=toD(qStart(K)),end=toD(qEnd(K));while(dt<=end){if(dt.getDay()===Number(wd))out.push(fromD(dt));dt.setDate(dt.getDate()+1)}return out}
function occDeuda(d,K,base){
  if(d.tipo!=="unico"&&d.desde)return occDeudaRaw(d,K,base).filter(x=>x>=d.desde);
  return occDeudaRaw(d,K,base);
}
function occDeudaRaw(d,K,base){
  switch(d.tipo){
    case"mensual":case"msi":return monthlyIn(d.dia,K);
    case"quincenal":return[qStart(K)];
    case"semanal":return weeklyIn(d.diaSemana,K);
    case"unico":{const k=qOf(d.fecha);if(k===K)return[d.fecha];if(K===base&&k<base)return[d.fecha];return[]}
  }return[];
}
const occFijo=(f,K)=>f.frecuencia==="quincenal"?[qStart(K)]:monthlyIn(f.dia,K);
const occIngreso=(i,K)=>(i.quincena==="ambas"||i.quincena===K.slice(8))?[qStart(K)]:[];

const linked=(f,id,K)=>S.movimientos.filter(x=>x[f]===id&&(K===undefined||x.q===K));
const pagadoDeuda=d=>r2(sum(linked("deudaId",d.id),x=>x.monto));
const tarjetaDe=d=>S.cuentas.find(c=>c.tipo==="credito"&&c.deudaId===d.id);
const esTarjeta=id=>{const c=S.cuentas.find(x=>x.id===id);return!!c&&c.tipo==="credito"};
/* Compras con la tarjeta (registradas después de vincularla) suben el saldo; devoluciones lo bajan. */
function cargos(d){const c=tarjetaDe(d);if(!c)return 0;return r2(sum(S.movimientos.filter(x=>x.cuentaId===c.id&&x.deudaId!==d.id&&(x.ts||0)>=(c.vinculoTs||0)&&x.ts),x=>x.tipo==="gasto"?x.monto:-x.monto))}
const saldo=d=>Math.max(0,r2(d.montoInicial+cargos(d)-pagadoDeuda(d)));
function adeudoTarjeta(c){const d=c.deudaId&&S.deudas.find(x=>x.id===c.deudaId);return d?saldo(d):Math.max(0,-saldoCuenta(c))}
const hechos=d=>(d.pagosPrevios||0)+linked("deudaId",d.id).length;
function restantes(d){const s=saldo(d);if(s<=0.005)return 0;if(d.tipo==="msi")return Math.max(0,d.pagosTotales-hechos(d));if(d.tipo==="unico")return 1;return Math.ceil(s/d.pago-1e-9)}
/* Pagos pendientes de una deuda en la quincena K, proyectando desde la quincena base (la actual). */
function pendDeuda(d,K,base){
  if(K<base)return[];
  let rem=restantes(d),left=saldo(d),k=base,guard=0;
  while(rem>0&&k<=K&&guard++<400){
    const occ=occDeuda(d,k,base),paid=linked("deudaId",d.id,k).length;
    const take=Math.min(Math.max(0,occ.length-paid),rem);
    if(k===K){const rows=[];for(let i=0;i<take;i++){const amt=d.tipo==="unico"?left:Math.min(d.pago,left);rows.push({fecha:occ[Math.min(paid+i,occ.length-1)],monto:r2(amt)});left-=amt}return rows}
    rem-=take;left=d.tipo==="unico"?(take?0:left):Math.max(0,left-take*d.pago);k=qNext(k);
  }
  return[];
}
function sigPago(d){if(saldo(d)<=0.005)return null;let k=CURQ;for(let i=0;i<60;i++){const r=pendDeuda(d,k,CURQ);if(r.length)return{q:k,...r[0]};k=qNext(k)}return null}

function filas(items,occFn,field,K,montoFn){
  const out=[];
  items.forEach(it=>{
    const occ=occFn(it,K),paid=linked(field,it.id,K);
    paid.forEach(m=>out.push({item:it,fecha:m.fecha,monto:m.monto,paid:true}));
    for(let i=paid.length;i<occ.length;i++)out.push({item:it,fecha:occ[i],monto:montoFn(it),paid:false});
  });
  return out.sort((a,b)=>a.fecha.localeCompare(b.fecha));
}
function quincena(K){
  const ingresos=filas(S.ingresosFijos,occIngreso,"ingresoId",K,i=>i.monto);
  const fijos=filas(S.fijos,occFijo,"fijoId",K,f=>f.monto);
  const deudas=[];
  S.deudas.forEach(d=>{
    linked("deudaId",d.id,K).forEach(m=>deudas.push({item:d,fecha:m.fecha,monto:m.monto,paid:true}));
    pendDeuda(d,K,CURQ).forEach(r=>deudas.push({item:d,fecha:r.fecha,monto:r.monto,paid:false}));
  });
  deudas.sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const a=qStart(K),b=qEnd(K);
  const gastoVar={};
  S.movimientos.forEach(x=>{if(x.tipo==="gasto"&&!x.deudaId&&!x.fijoId&&x.fecha>=a&&x.fecha<=b)gastoVar[x.categoria]=(gastoVar[x.categoria]||0)+x.monto});
  const ingreso=sum(ingresos,x=>x.monto);
  const comp=[...fijos,...deudas];
  const compromisos=sum(comp,x=>x.monto), pagado=sum(comp.filter(x=>x.paid),x=>x.monto);
  const variables=sum(Object.values(S.limites||{}),v=>+v||0);
  return{K,ingresos,fijos,deudas,gastoVar,ingreso,compromisos,pagado,porPagar:r2(compromisos-pagado),variables,disponible:r2(ingreso-compromisos-variables)};
}
const movsMes=M=>S.movimientos.filter(x=>mk(x.fecha)===M);
function totales(M){let i=0,g=0;movsMes(M).forEach(x=>{if(esTarjeta(x.cuentaId))return;x.tipo==="ingreso"?i+=x.monto:g+=x.monto});return{i,g,b:i-g}}
function saldoCuenta(c){let s=Number(c.saldoInicial)||0;S.movimientos.forEach(x=>{if(x.cuentaId===c.id)s+=x.tipo==="ingreso"?x.monto:-x.monto});return s}
function mesesHasta(f){const[y,m]=P(f);return(y-now.getFullYear())*12+(m-(now.getMonth()+1))}

function migrar(o){

  if(o.v===2)return Object.assign(vacio(),o);
  if(o.ejemplo)return ejemplo();
  const n=vacio();n.cuentas=o.cuentas&&o.cuentas.length?o.cuentas:n.cuentas;n.movimientos=o.movimientos||[];n.metas=o.metas||[];
  Object.entries(o.presupuestos||{}).forEach(([c,v])=>{if(c!=="Vivienda"&&c!=="Deudas"&&v)n.limites[c]=Math.round(v/2)});
  n.deudas=(o.deudas||[]).map(d=>{const rest=Math.max(0,(d.pagosTotales||0)-(d.pagosHechos||0));const base={id:d.id,nombre:d.nombre,acreedor:d.acreedor||"",pago:d.pago,dia:d.dia||1,diaSemana:5,desde:TODAY,montoInicial:r2(rest*d.pago)};

}

function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x)));const f=x/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function chartSVG(){
  const W=600,H=210,L=52,R=8,T=12,B=26;const ms=[];for(let i=5;i>=0;i--)ms.push(addMonths(mes,-i));
  const data=ms.map(totales);const max=Math.max(1000,...data.map(d=>Math.max(d.i,d.g)));
  const step=niceStep(max/4),top=Math.ceil(max/step)*step,y=v=>T+(H-T-B)*(1-v/top),gw=(W-L-R)/6,bw=Math.min(22,gw*.3);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y gastos de los últimos seis meses">`;
  for(let v=0;v<=top+1e-6;v+=step)s+=`<line class="grid-l" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-8}" y="${y(v)+4}" text-anchor="end">${v>=1000?Math.round(v/1000)+"k":v}</text>`;
  data.forEach((d,i)=>{const cx=L+gw*i+gw/2;
    if(ms[i]===mes)s+=`<rect class="cur" x="${L+gw*i+3}" y="${T}" width="${gw-6}" height="${H-T-B}" rx="6"/>`;
    s+=`<rect class="b-in" x="${cx-bw-2}" y="${y(d.i)}" width="${bw}" height="${Math.max(0,y(0)-y(d.i))}" rx="3"><title>Ingresos ${money(d.i)}</title></rect>`;
    s+=`<rect class="b-out" x="${cx+2}" y="${y(d.g)}" width="${bw}" height="${Math.max(0,y(0)-y(d.g))}" rx="3"><title>Gastos ${money(d.g)}</title></rect>`;
    s+=`<text class="ax" x="${cx}" y="${H-8}" text-anchor="middle">${monthName(ms[i],true).replace(".","")}</text>`});
  return s+"</svg>";
}

function qPanel(K){

  const sec=(titulo,rows,kind,total)=>`<div class="qsec"><div class="label"><span>${titulo}</span><span class="num">${money(total)}</span></div>${rows.length?rows.map(r=>payRow(kind,r,K)).join(""):`<div class="qempty">Nada programado.</div>`}</div>`;
  const cats=Object.keys({...S.limites,...Q.gastoVar}).filter(c=>Q.gastoVar[c]||S.limites[c]);

      <div class="foot">${done?"":`<button class="btn small primary" data-pay-deuda="${d.id}">Registrar pago</button>`}<button class="btn small ghost" data-edit-deuda="${d.id}">Editar</button><button class="btn small ghost danger" data-del-deuda="${d.id}">Eliminar</button></div></article>`}).join("");

/* ================= modales ================= */
function openModal(title,body,onSubmit){
  const root=document.getElementById("modalRoot");
  root.innerHTML=`<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">${esc(title)}</h2><form id="mf" novalidate>${body}<p class="err" id="mErr" hidden></p><div class="mfoot"><button type="button" class="btn" id="mCancel">Cancelar</button><button type="submit" class="btn primary">Guardar</button></div></form></div></div>`;
  const f=document.getElementById("mf");
  f.addEventListener("submit",e=>{e.preventDefault();const fd=Object.fromEntries(new FormData(f));const err=onSubmit(fd,f);if(err){const el=document.getElementById("mErr");el.textContent=err;el.hidden=false}else closeModal()});
  document.getElementById("mCancel").onclick=closeModal;
  document.getElementById("ov").addEventListener("mousedown",e=>{if(e.target.id==="ov")closeModal()});
}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
const num=v=>{const n=parseFloat(String(v??"").replace(/[,$\s]/g,""));return isFinite(n)?n:NaN};
const opt=(arr,sel)=>arr.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(sel)?"selected":""}>${esc(l)}</option>`).join("");
const cuentaOpts=sel=>opt(S.cuentas.map(c=>[c.id,c.nombre]),sel);
function qOpts(sel){let k=qPrev(qPrev(sel));const o=[];for(let i=0;i<5;i++){o.push([k,`${qFull(k)} (${qRange(k)})`]);k=qNext(k)}return opt(o,sel)}
function field(id,label,input,extra){return`<div class="field" ${extra||""}><label for="${id}">${label}</label>${input}</div>`}

    const monto=num(fd.monto);if(!(monto>0))return"Escribe un monto mayor a cero.";if(!fd.cuentaId)return"Crea primero una cuenta en la pestaña Cuentas.";

function pagar(kind,id,K,monto,fecha){
  const f=K>=CURQ?TODAY:fecha;
  if(kind==="deuda"){const d=S.deudas.find(x=>x.id===id);return payForm({titulo:`Pagar · ${d.nombre}`,tipo:"gasto",categoria:"Deudas",desc:d.nombre,link:{deudaId:id},q:K,monto,fecha:f,nota:`Saldo pendiente ${money(saldo(d))}. El pago se descuenta del saldo y se registra como gasto.`})}
  if(kind==="fijo"){const x=S.fijos.find(y=>y.id===id);return payForm({titulo:`Pagar · ${x.nombre}`,tipo:"gasto",categoria:x.categoria,desc:x.nombre,link:{fijoId:id},q:K,monto,fecha:f})}
  const i=S.ingresosFijos.find(y=>y.id===id);payForm({titulo:`Recibir · ${i.nombre}`,tipo:"ingreso",categoria:i.categoria,desc:i.nombre,link:{ingresoId:id},q:K,monto,fecha:f});
}

   ${g("mensual quincenal semanal",`<div class="frow">${field("dSaldo","Saldo pendiente hoy",`<input id="dSaldo" name="saldo" inputmode="decimal" value="${d&&t!=="unico"&&t!=="msi"?s:""}">`)}${field("dPago","Pago por periodo",`<input id="dPago" name="pago" inputmode="decimal" value="${d&&t!=="unico"&&t!=="msi"?d.pago:""}">`)}</div>`)}

   ${g("semanal",field("dDs","Día de la semana",`<select id="dDs" name="diaSemana">${opt(DIAS.map((x,i)=>[i,x]),d?d.diaSemana:5)}</select>`))}
   <p class="hint" id="dHint"></p>`,fd=>{
    const nombre=fd.nombre.trim();if(!nombre)return"Ponle un nombre a la deuda.";
    const rec={id:d?d.id:uid(),nombre,acreedor:fd.acreedor.trim(),tipo:fd.tipo,desde:d&&d.desde||TODAY};

      Object.assign(rec,{pago:p,pagosTotales:n,pagosPrevios:Math.max(0,h-paidCnt),dia,montoInicial:r2(p*(n-h)+paidSum)})}

      if(fd.tipo==="mensual"){const dia=parseInt(fd.dia);if(!(dia>=1&&dia<=31))return"El día de pago debe estar entre 1 y 31.";rec.dia=dia}
      if(fd.tipo==="semanal")rec.diaSemana=parseInt(fd.diaSemana)}
    S.deudas=d?S.deudas.map(x=>x.id===d.id?rec:x):[...S.deudas,rec];modify();toast("Deuda guardada");
  });
  const upd=()=>{const tv=document.getElementById("dTipo").value;document.querySelectorAll("[data-for]").forEach(el=>el.hidden=!el.dataset.for.split(" ").includes(tv));
    document.getElementById("dHint").textContent={unico:"Se programa en la quincena que corresponde a la fecha límite.",msi:"El saldo se calcula con los meses que faltan.",mensual:"Ideal para tarjetas de crédito: escribe el saldo total y lo que planeas pagar cada mes.",quincenal:"Se programa un pago en cada quincena hasta liquidar el saldo.",semanal:"Se programa un pago cada semana; una quincena puede tener 2 o 3."}[tv]+(tv==="msi"||tv==="mensual"?" Si vence entre el 15 y el 29 se cubre con la quincena del 15; si no, con la del 30.":"")};

function cuentaForm(c){
  const otras=S.cuentas.filter(x=>x.tipo==="credito"&&x.deudaId&&(!c||x.id!==c.id)).map(x=>x.deudaId);

  openModal(c?"Editar cuenta":"Nueva cuenta",`
   ${field("cNom","Nombre",`<input id="cNom" name="nombre" value="${esc(c?c.nombre:"")}" placeholder="Ej. Cuenta de nómina, TDC Oro">`)}
   ${field("cTipo","Tipo",`<select id="cTipo" name="tipo">${opt(Object.entries(TIPOS_CUENTA),c&&c.tipo)}</select>`)}

   <div data-cf="credito" class="grid" style="gap:12px">
     ${field("cLim","Línea de crédito (límite total)",`<input id="cLim" name="limite" inputmode="decimal" value="${c&&c.limite||""}" placeholder="Ej. 40000">`)}
     ${field("cDeu","Vincular con deuda",`<select id="cDeu" name="deudaId"><option value="">No vincular</option>${opt(deudas,vinc)}<option value="__nueva">Crear deuda nueva para esta tarjeta</option></select>`)}

     <div data-cf="nueva" class="frow">${field("cPago","Pago que harás al mes",`<input id="cPago" name="pagoNuevo" inputmode="decimal" placeholder="Ej. 2100">`)}${field("cDia","Día de pago (1–31)",`<input id="cDia" name="diaNuevo" inputmode="numeric" value="30">`)}</div>
     <p class="hint">Al vincularla, el adeudo es el saldo de la deuda: baja con cada pago y sube con las compras que registres con la tarjeta.</p>
   </div>`,fd=>{

      if(dId){rec.deudaId=dId;rec.vinculoTs=c&&c.deudaId===dId&&c.vinculoTs?c.vinculoTs:Date.now()}
      else{const a=num(fd.adeudo)||0;rec.saldoInicial=-Math.max(0,a)}
    }
    S.cuentas=c?S.cuentas.map(x=>x.id===c.id?rec:x):[...S.cuentas,rec];modify();toast("Cuenta guardada");
  });
  const u=()=>{const t=document.getElementById("cTipo").value,dv=document.getElementById("cDeu").value;

  document.getElementById("cNo").onclick=closeModal;document.getElementById("cYes").onclick=()=>{closeModal();onOk()};
}

/* ================= eventos ================= */
document.addEventListener("click",e=>{
  if(e.target.id==="bkNow")return document.getElementById("expJson").click();
  const b=e.target.closest("button,[data-go]");if(!b)return;const d=b.dataset;
  const find=(arr,id)=>arr.find(x=>x.id===id);

  if(d.payDeuda){const x=find(S.deudas,d.payDeuda),sp=sigPago(x);return pagar("deuda",x.id,sp?sp.q:CURQ,sp?sp.monto:Math.min(x.pago,saldo(x)),sp?sp.fecha:TODAY)}

  if(d.abono)return abonoForm(find(S.metas,d.abono));
  if(d.editMeta)return metaForm(find(S.metas,d.editMeta));
  if(d.delMeta){const x=find(S.metas,d.delMeta);return confirmBox("Eliminar meta",`Se eliminará la meta "${x.nombre}".`,"Eliminar",()=>{S.metas=S.metas.filter(y=>y.id!==x.id);modify()})}
  if(d.editCuenta)return cuentaForm(find(S.cuentas,d.editCuenta));
  if(d.delCuenta){const x=find(S.cuentas,d.delCuenta);return confirmBox("Eliminar cuenta",`Se eliminará la cuenta "${x.nombre}".`,"Eliminar",()=>{S.cuentas=S.cuentas.filter(y=>y.id!==x.id);modify()})}
  switch(d.act){

/* ================= respaldo ================= */
async function save(filename,data){
  const type=filename.endsWith(".csv")?"text/csv":"application/json";const blob=new Blob([data],{type});
  try{const file=new File([blob],filename,{type});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});markBackup();return}}catch(e){if(e&&e.name==="AbortError")return}
  const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);markBackup();
}
function markBackup(){try{localStorage.setItem(LS+".respaldo",TODAY)}catch(e){}render()}
function diasSinRespaldo(){try{const d=localStorage.getItem(LS+".respaldo");if(!d)return null;return Math.round((toD(TODAY)-toD(d))/864e5)}catch(e){return null}}
document.getElementById("expJson").onclick=()=>save(`finanzas-respaldo-${TODAY}.json`,JSON.stringify(S,null,2));
document.getElementById("expCsv").onclick=()=>{
  const cn=Object.fromEntries(S.cuentas.map(c=>[c.id,c.nombre])),q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const rows=[["Fecha","Tipo","Categoría","Descripción","Cuenta","Quincena","Monto"].join(",")].concat(S.movimientos.slice().sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(x=>[x.fecha,x.tipo,q(x.categoria),q(x.nota),q(cn[x.cuentaId]),q(qFull(x.q||qOf(x.fecha))),(x.tipo==="gasto"?-x.monto:x.monto).toFixed(2)].join(",")));
  save(`movimientos-${TODAY}.csv`,"﻿"+rows.join("\n"));
};
document.getElementById("impFile").onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=migrar(JSON.parse(r.result));if(!d||!Array.isArray(d.movimientos))throw 0;
    confirmBox("Importar respaldo",`Se reemplazarán tus datos actuales con ${d.movimientos.length} movimientos y ${d.deudas.length} deudas del archivo.`,"Importar",()=>{S=d;S.ejemplo=false;modify();markBackup();toast("Respaldo importado")});
  }catch(_){toast("El archivo no es un respaldo válido de Mis Finanzas")}e.target.value=""};
  r.readAsText(f);
};
